  legal_name: "<LEGAL_CLINIC_NAME>"                 # Status: OFFICIAL CLINIC IDENTITY — PENDING CLINIC INPUT
  institution_code: "CLINIC-QA"                     # Status: EXISTING STRUCTURE — VERIFIED
  institution_type: "clinic"                        # Status: EXISTING STRUCTURE — VERIFIED
  cr_number: "<CR_NUMBER>"                          # Status: PENDING CLINIC INPUT
  moph_license: "<MOPH_LICENSE_NUMBER>"             # Status: PENDING CLINIC INPUT
  country: "Qatar"                                  # Status: VERIFIED LOADED
  country_code: "QA"                                # Status: ISO 3166-1 alpha-2 VERIFIED
  phone_prefix: "+974"                              # Status: Qatar country calling code
  currency: "QAR"                                   # Status: VERIFIED (ID: 3, Symbol: ر.ق, 2 Dec, Rounding: 0.01)
  currency_symbol: "ر.ق"                           # Status: VERIFIED
  timezone: "Asia/Qatar"                            # Status: VERIFIED (UTC+3)
  language:
    primary: "en"                                   # English (Default Interface)
    secondary: "ar"                                 # Arabic (RTL Clinical & Administrative)

address:
  building: "<BUILDING_NUMBER>"                     # Blue Plate National Address (PENDING CLINIC INPUT)
  street: "<STREET_NUMBER>"                         # Blue Plate National Address (PENDING CLINIC INPUT)
  zone: "<ZONE_NUMBER>"                             # Blue Plate National Address (PENDING CLINIC INPUT)
  city: "<CITY>"                                    # Doha / Al Rayyan / Al Wakrah (PENDING CLINIC INPUT)
  country: "Qatar"
  phone: "+974 <PHONE_NUMBER>"                      # Landline / Reception (PENDING CLINIC INPUT)
  email: "<INFO_EMAIL>"                             # Official Contact Email (PENDING CLINIC INPUT)
  website: "OFFICIAL PRODUCTION DOMAIN / FQDN — PENDING USER INPUT"

