doctors: []  # Status: PENDING CLINIC INPUT (Requires QCHP license numbers & approved roster)

# ------------------------------------------------------------------------------
# Role-Based Access Control (RBAC) Structure
# Status: IMPLEMENTED AS PROFESSIONAL DEFAULT (Security groups active; staff users pending)
# ------------------------------------------------------------------------------
users:
  - role: "System Administrator"
    groups: ["Administration"]
    scope: "Platform operations, backups, system configuration"
  - role: "Clinic Administrator"
    groups: ["Health Administration", "Company Administration"]
    scope: "Operational parameters, departmental configuration, rosters"
  - role: "Medical Director"
    groups: ["Health Administration", "Health Doctor", "Health Services Administration"]
    scope: "Clinical governance, doctor supervision, medical approvals"
  - role: "Outpatient Physician"
    groups: ["Health Doctor", "Health Services Administration"]
    scope: "Patient encounters, SOAP charting, e-prescriptions, diagnostic orders"
  - role: "Triage Nurse"
    groups: ["Health Nurse", "Health Nurse Administration"]
    scope: "Vital signs recording, BMI calculation, nursing treatments"
  - role: "Receptionist"
    groups: ["Health Front Desk", "Party Administration"]
    scope: "Patient registration, appointment scheduling, queue check-in"
  - role: "Pharmacist"
    groups: ["Health Back Office", "Product Administration"]
    scope: "Prescription verification, medication dispensing, stock deduction"
  - role: "Laboratory Technician"
    groups: ["Health Lab", "Health lab Administration"]
    scope: "Diagnostic order accessioning, result entry, lab reporting"
  - role: "Radiology Technician"
    groups: ["Health Imaging", "Health Imaging Administration"]
    scope: "Imaging requisitions, study logs, radiological report upload"
  - role: "Billing Officer / Cashier"
    groups: ["Account", "Account Administration", "Health Back Office"]
    scope: "Invoice aggregation, cashier receipting, payment collection"
  - role: "Insurance Specialist"
    groups: ["Health Insurance", "Health Back Office"]
    scope: "Payer policy verification, copay calculation, claim documentation"
  - role: "Finance Lead / Chief Accountant"
    groups: ["Account", "Account Administration", "Company Administration"]
    scope: "General ledger, chart of accounts, fiscal year management, audits"

