# ==============================================================================
# IST HEALTH HMIS — PRODUCTION NGINX REVERSE PROXY & TLS CONFIGURATION
# Enforces:
# 1. Full HTTPS termination (TLS 1.2 & 1.3) with HSTS
# 2. Strict backend protection: Tryton port 8000 bound ONLY to 127.0.0.1
# 3. Dynamic multi-tenant database routing for Next.js BFF & Tryton RPC
# 4. Zero exposure of Tryton administrative ports to public Internet
# ==============================================================================

# HTTP -> HTTPS Global Redirection
server {
    listen 80;
    listen [::]:80;
    server_name ist-health.qa *.ist-health.qa;

    # ACME Let's Encrypt challenge path for certbot automated renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Production HTTPS Virtual Host
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ist-health.qa *.ist-health.qa;

    # SSL / TLS Modern Cryptographic Configuration
    ssl_certificate /etc/letsencrypt/live/ist-health.qa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ist-health.qa/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/ist-health.qa/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Hardening Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Client payload bounds (10MB for imaging & diagnostic attachments)
    client_max_body_size 10M;

    # Next.js Frontend Application Proxy (Primary Web App)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Authoritative Multi-Tenant Tryton RPC Backend Proxy
    # Dynamically maps tenant database endpoints (e.g. /gnuhealth/, /gnuhealth_test_alpha/)
    # NOTE: Direct public traffic to port 8000 is blocked via local loopback binding.
    location ~ ^/(gnuhealth[a-z0-9_]*)/ {
        # Optional: Restrict direct RPC access to internal trusted addresses or Next.js BFF only
        # allow 127.0.0.1;
        # allow 10.0.0.0/8;
        # deny all;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
    }
}
